<!--sidebar-->
<c-sidebar #sidebar="cSidebar" class="d-print-none sidebar sidebar-fixed" colorScheme="light" id="sidebar" visible>

<c-sidebar-header class="border-bottom sidebar-header-row">
  <c-sidebar-brand
    [brandFull]="brandFull()"
    [brandNarrow]="brandNarrow()"
    routerLink="./"
  >

  </c-sidebar-brand>

  <!-- Collapse (unfold) toggle — moved here from the footer (footer now holds
       the user menu). Folds the sidebar to the narrow icon rail. Mirrors the
       original structure: container carries cSidebarToggle + toggle, the inner
       button carries cSidebarToggler (the two directives must NOT share an el). -->
  @if (!sidebar.narrow) {
    <div cSidebarToggle="sidebar" toggle="unfoldable" class="sidebar-fold-toggle d-none d-lg-flex" style="cursor: pointer;">
      <button cSidebarToggler aria-label="Collapse sidebar"></button>
    </div>
  }
</c-sidebar-header>
  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="none" compact />
  </ng-scrollbar>

  <!-- User menu in the sidebar footer (console view) — matches the source.
       Hidden when the sidebar is collapsed to the narrow rail. -->
  @if (!sidebar.narrow) {
    <c-sidebar-footer class="border-top sidebar-user-footer">
      <app-user-menu placement="sidebar" class="w-100"></app-user-menu>
    </c-sidebar-footer>
  }
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100 dark:bg-transparent">
  <!--app-header-->
  <app-default-header
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky"
    sidebarId="sidebar"
  />
  <!--app-body-->
  <div class="body flex-grow-1 px-3">
    <c-container fluid class="h-auto">
      <!-- system-notification area — standalone component owns its
           own fetch + render; this is the only integration surface. -->
      <system-notifications-banner></system-notifications-banner>
      <router-outlet></router-outlet>
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer></app-default-footer>
</div>
